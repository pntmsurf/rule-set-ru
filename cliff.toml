  { message = "^⏪️?", group = "<!-- 15 -->⏪ Reverts" },
  { message = "^🔀", group = "<!-- 15 -->⏪ Reverts" },

  { message = "^🚨", group = "<!-- 16 -->🚨 Linter" },

  { message = "^🎉", group = "<!-- 17 -->🎉 Initial" },

  { message = "^🔖", skip = true },
  { message = "^🚧", skip = true },
  { message = "^💩", skip = true },
  { message = "^🍻", skip = true },

  { message = ".*", group = "<!-- 18 -->🔩 Other" },
]

[bump]
custom_major_increment_regex = "^💥"
custom_minor_increment_regex = "^✨"
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"