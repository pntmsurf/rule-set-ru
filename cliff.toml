[changelog]
header = """
All notable changes to this project will be documented in this file.\n
"""
body = """
{%- macro remote_url() -%}
    https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{% if version %}\
{% else %}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    {% for commit in commits %}
        * {{ commit.message | split(pat="\n") | first | upper_first }} ([#{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
filter_commits = false
tag_pattern = "v[0-9]*.[0-9]*.[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^💥", group = "<!-- 00 -->💥 Breaking Changes" },

  { message = "^✨", group = "<!-- 01 -->✨ Features" },
  { message = "^🚩", group = "<!-- 01 -->✨ Features" },
  { message = "^🥚", group = "<!-- 01 -->✨ Features" },

  { message = "^🐛", group = "<!-- 02 -->🐛 Fixes" },
  { message = "^🚑️?", group = "<!-- 02 -->🐛 Fixes" },
  { message = "^🩹", group = "<!-- 02 -->🐛 Fixes" },
  { message = "^🥅", group = "<!-- 02 -->🐛 Fixes" },
  { message = "^🦺", group = "<!-- 02 -->🐛 Fixes" },

  { message = "^🔒️?", group = "<!-- 03 -->🔒 Security" },
  { message = "^🔐", group = "<!-- 03 -->🔒 Security" },
  { message = "^🛂", group = "<!-- 03 -->🔒 Security" },

  { message = "^⚡️?", group = "<!-- 04 -->⚡ Performance" },

  { message = "^♻️", group = "<!-- 05 -->♻️ Refactor" },
  { message = "^🏗️", group = "<!-- 05 -->♻️ Refactor" },
  { message = "^🚚", group = "<!-- 05 -->♻️ Refactor" },
  { message = "^⚰️", group = "<!-- 05 -->♻️ Refactor" },
  { message = "^🗑️", group = "<!-- 05 -->♻️ Refactor" },
  { message = "^🔥", group = "<!-- 05 -->♻️ Refactor" },

  { message = "^📝", group = "<!-- 06 -->📝 Documentation" },
  { message = "^💡", group = "<!-- 06 -->📝 Documentation" },
  { message = "^📄", group = "<!-- 06 -->📝 Documentation" },
  { message = "^💬", group = "<!-- 06 -->📝 Documentation" },
  { message = "^👥", group = "<!-- 06 -->📝 Documentation" },

  { message = "^✅", group = "<!-- 07 -->✅ Tests" },
  { message = "^🧪", group = "<!-- 07 -->✅ Tests" },
  { message = "^📸", group = "<!-- 07 -->✅ Tests" },

  { message = "^👷", group = "<!-- 08 -->👷 CI/CD" },
  { message = "^💚", group = "<!-- 08 -->👷 CI/CD" },
  { message = "^🚀", group = "<!-- 08 -->👷 CI/CD" },

  { message = "^⬆️", group = "<!-- 09 -->📦 Dependencies" },
  { message = "^⬇️", group = "<!-- 09 -->📦 Dependencies" },
  { message = "^📌", group = "<!-- 09 -->📦 Dependencies" },
  { message = "^➕", group = "<!-- 09 -->📦 Dependencies" },
  { message = "^➖", group = "<!-- 09 -->📦 Dependencies" },
  { message = "^📦️?", group = "<!-- 09 -->📦 Dependencies" },

  { message = "^🔧", group = "<!-- 10 -->🔧 Configuration" },
  { message = "^🔨", group = "<!-- 10 -->🔧 Configuration" },
  { message = "^🙈", group = "<!-- 10 -->🔧 Configuration" },
  { message = "^🧱", group = "<!-- 10 -->🔧 Configuration" },
  { message = "^🧑‍💻", group = "<!-- 10 -->🔧 Configuration" },
  { message = "^🌐", group = "<!-- 10 -->🔧 Configuration" },

  { message = "^🎨", group = "<!-- 11 -->🎨 Style" },
  { message = "^💄", group = "<!-- 11 -->🎨 Style" },
  { message = "^✏️", group = "<!-- 11 -->🎨 Style" },

  { message = "^🚸", group = "<!-- 12 -->🚸 UX" },
  { message = "^♿️?", group = "<!-- 12 -->🚸 UX" },
  { message = "^📱", group = "<!-- 12 -->🚸 UX" },
  { message = "^💫", group = "<!-- 12 -->🚸 UX" },

  { message = "^🗃️", group = "<!-- 13 -->🗃️ Data" },
  { message = "^🔊", group = "<!-- 13 -->🗃️ Data" },
  { message = "^🔇", group = "<!-- 13 -->🗃️ Data" },
  { message = "^🌱", group = "<!-- 13 -->🗃️ Data" },
  { message = "^🏷️", group = "<!-- 13 -->🗃️ Data" },
  { message = "^🧐", group = "<!-- 13 -->🗃️ Data" },

  { message = "^👔", group = "<!-- 14 -->🧩 Misc" },
  { message = "^🩺", group = "<!-- 14 -->🧩 Misc" },
  { message = "^🍱", group = "<!-- 14 -->🧩 Misc" },
  { message = "^🔍️?", group = "<!-- 14 -->🧩 Misc" },
  { message = "^⚗️", group = "<!-- 14 -->🧩 Misc" },
  { message = "^🧵", group = "<!-- 14 -->🧩 Misc" },
  { message = "^👽️?", group = "<!-- 14 -->🧩 Misc" },
  { message = "^🤡", group = "<!-- 14 -->🧩 Misc" },
